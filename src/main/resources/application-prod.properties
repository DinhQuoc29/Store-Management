# ===================================
# NhungTrinh Store - Production Config
# ===================================
spring.application.name=nhungtrinhstore

# --- Database (MySQL) - đọc từ biến môi trường ---
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/nhungtrinhstore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:shizadon2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=${PORT:8080}

# --- Serve Angular static files ---
spring.web.resources.static-locations=file:/app/static/,classpath:/static/
spring.mvc.static-path-pattern=/**

# --- Jackson ---
spring.jackson.deserialization.fail-on-unknown-properties=false

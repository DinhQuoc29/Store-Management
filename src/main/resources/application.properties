# ===================================
# NhungTrinh Store - Application Config
# ===================================
spring.application.name=nhungtrinhstore

# --- Database (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/nhungtrinhstore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=shizadon2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080

# --- Jackson ---
spring.jackson.deserialization.fail-on-unknown-properties=false